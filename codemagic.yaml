workflows:
  ios-app:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.sat.mobile
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20

    scripts:
      - name: Install dependencies
        script: |
          cd front
          npm ci

      - name: Build web app
        script: |
          cd front
          npm run build

      - name: Install Capacitor dependencies
        script: |
          cd front
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd front/ios/App
          pod install

      - name: Build iOS app
        script: |
          cd front/ios/App
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - front/ios/App/build/outputs/**/*

  android-app:
    name: Android Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17
      node: 20

    scripts:
      - name: Install dependencies
        script: |
          cd front
          npm ci

      - name: Build web app
        script: |
          cd front
          npm run build

      - name: Sync Capacitor
        script: |
          cd front
          npx cap sync android

      - name: Build Android APK
        script: |
          cd front/android
          ./gradlew assembleDebug

    artifacts:
      - front/android/app/build/outputs/**/*.apk
